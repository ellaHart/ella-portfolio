<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ella Hartsell | UI/UX Designer & Developer</title>
    <meta name="description" content="Ella Hartsell designs and develops thoughtful digital experiences that balance usability, functionality, and creativity." />
    <meta name="theme-color" content="#F8F2E8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/images/brand/headshot-suit-1000.webp" type="image/webp" />
    <script>
      // Apply the saved presentation mode and theme before first paint to avoid a flash.
      (function () {
        var root = document.documentElement, saved = null;
        try {
          if (localStorage.getItem('eh:mode') === 'creative') root.dataset.mode = 'creative';
          saved = localStorage.getItem('eh:theme');
        } catch (e) {}
        root.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
